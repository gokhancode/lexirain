<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LexiRain Analytics Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      min-height: 100vh;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 2em;
    }
    
    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
    
    .stat-value {
      font-size: 2.5em;
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    .stat-label {
      font-size: 0.9em;
      opacity: 0.9;
    }
    
    .controls {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: #667eea;
      color: white;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    
    button:hover {
      background: #5568d3;
    }
    
    select {
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }
    
    .events-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    
    .events-table th {
      background: #f5f5f5;
      padding: 12px;
      text-align: left;
      font-weight: 600;
      color: #333;
      border-bottom: 2px solid #ddd;
    }
    
    .events-table td {
      padding: 12px;
      border-bottom: 1px solid #eee;
    }
    
    .events-table tr:hover {
      background: #f9f9f9;
    }
    
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85em;
      font-weight: 600;
    }
    
    .badge-correct {
      background: #4caf50;
      color: white;
    }
    
    .badge-wrong {
      background: #f44336;
      color: white;
    }
    
    .badge-missed {
      background: #ff9800;
      color: white;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }
    
    .error {
      background: #ffebee;
      color: #c62828;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
    }
    
    .word-cell {
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 LexiRain Analytics Dashboard</h1>
    <p class="subtitle">View user answers and game statistics in real-time</p>
    
    <div id="error" class="error" style="display: none;"></div>
    
    <div class="stats-grid" id="stats">
      <div class="stat-card">
        <div class="stat-value" id="total-events">-</div>
        <div class="stat-label">Total Events</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="total-answers">-</div>
        <div class="stat-label">Total Answers</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="correct-answers">-</div>
        <div class="stat-label">Correct Answers</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="wrong-answers">-</div>
        <div class="stat-label">Wrong Answers</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="games-started">-</div>
        <div class="stat-label">Games Started</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="games-ended">-</div>
        <div class="stat-label">Games Ended</div>
      </div>
    </div>
    
    <div class="controls">
      <button onclick="loadData()">🔄 Refresh</button>
      <select id="filter-type" onchange="loadData()">
        <option value="">All Events</option>
        <option value="answer">Answers Only</option>
        <option value="game_start">Game Starts</option>
        <option value="game_end">Game Ends</option>
      </select>
      <select id="limit" onchange="loadData()">
        <option value="50">Last 50</option>
        <option value="100" selected>Last 100</option>
        <option value="200">Last 200</option>
        <option value="500">Last 500</option>
      </select>
      <button onclick="autoRefresh()" id="auto-refresh-btn">▶️ Auto Refresh (Off)</button>
    </div>
    
    <div id="loading" class="loading">Loading data...</div>
    <table class="events-table" id="events-table" style="display: none;">
      <thead>
        <tr>
          <th>Time</th>
          <th>Type</th>
          <th>Word</th>
          <th>Translation</th>
          <th>User Answer</th>
          <th>Result</th>
          <th>Level</th>
          <th>Language</th>
        </tr>
      </thead>
      <tbody id="events-body"></tbody>
    </table>
  </div>

  <script>
    const API_URL = window.location.origin + '/api/view-analytics';
    let autoRefreshInterval = null;

    async function loadData() {
      const loading = document.getElementById('loading');
      const table = document.getElementById('events-table');
      const errorDiv = document.getElementById('error');
      
      loading.style.display = 'block';
      table.style.display = 'none';
      errorDiv.style.display = 'none';

      try {
        const type = document.getElementById('filter-type').value;
        const limit = document.getElementById('limit').value;
        const url = `${API_URL}?limit=${limit}${type ? `&type=${type}` : ''}`;
        
        const response = await fetch(url);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Failed to load data');
        }

        // Update stats
        document.getElementById('total-events').textContent = data.stats.totalEvents;
        document.getElementById('total-answers').textContent = data.stats.answers.total;
        document.getElementById('correct-answers').textContent = data.stats.answers.correct;
        document.getElementById('wrong-answers').textContent = data.stats.answers.wrong;
        document.getElementById('games-started').textContent = data.stats.games.started;
        document.getElementById('games-ended').textContent = data.stats.games.ended;

        // Update table
        const tbody = document.getElementById('events-body');
        tbody.innerHTML = '';

        if (data.events.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px; color: #666;">No events yet. Play a game to see data here!</td></tr>';
        } else {
          data.events.forEach(event => {
            const row = document.createElement('tr');
            const date = new Date(event.receivedAt || Date.now());
            
            let resultBadge = '';
            let userAnswer = '-';
            let word = '-';
            let translation = '-';
            let level = '-';
            let language = '-';

            if (event.type === 'answer') {
              const isCorrect = event.data?.isCorrect;
              resultBadge = isCorrect 
                ? '<span class="badge badge-correct">✓ Correct</span>'
                : '<span class="badge badge-wrong">✗ Wrong</span>';
              userAnswer = event.data?.userAnswer || '-';
              word = event.data?.word || '-';
              translation = event.data?.translation || '-';
              level = event.data?.level || '-';
              language = event.data?.language || '-';
            } else if (event.type === 'game_start') {
              resultBadge = '<span class="badge" style="background: #2196f3; color: white;">Start</span>';
              language = event.data?.language || '-';
            } else if (event.type === 'game_end') {
              resultBadge = `<span class="badge" style="background: #9c27b0; color: white;">End</span>`;
              level = event.data?.level || '-';
              language = event.data?.language || '-';
            }

            row.innerHTML = `
              <td>${date.toLocaleString()}</td>
              <td>${event.type}</td>
              <td class="word-cell">${word}</td>
              <td class="word-cell">${translation}</td>
              <td class="word-cell">${userAnswer}</td>
              <td>${resultBadge}</td>
              <td>${level}</td>
              <td>${language}</td>
            `;
            tbody.appendChild(row);
          });
        }

        loading.style.display = 'none';
        table.style.display = 'table';
      } catch (error) {
        loading.style.display = 'none';
        errorDiv.textContent = `Error: ${error.message}`;
        errorDiv.style.display = 'block';
        console.error('Error loading data:', error);
      }
    }

    function autoRefresh() {
      const btn = document.getElementById('auto-refresh-btn');
      if (autoRefreshInterval) {
        clearInterval(autoRefreshInterval);
        autoRefreshInterval = null;
        btn.textContent = '▶️ Auto Refresh (Off)';
      } else {
        autoRefreshInterval = setInterval(loadData, 5000); // Refresh every 5 seconds
        btn.textContent = '⏸️ Auto Refresh (On)';
      }
    }

    // Load data on page load
    loadData();
  </script>
</body>
</html>
