<!DOCTYPE html>
<html>
<head>
  <title>Send Test Analytics Data</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin: 10px 5px;
    }
    button:hover {
      background: #5568d3;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      white-space: pre-wrap;
      font-family: monospace;
    }
    .success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <h1>🧪 Send Test Analytics Data</h1>
  <p>Click the button below to send fake game data to your analytics endpoint.</p>
  
  <button onclick="sendData()">📤 Send Test Data</button>
  <button onclick="checkData()">👀 Check Received Data</button>
  
  <div id="result"></div>

  <script>
    const API_URL = 'https://lexirain.vercel.app/api/analytics';
    const VIEW_URL = 'https://lexirain.vercel.app/api/view-analytics';

    async function sendData() {
      const resultDiv = document.getElementById('result');
      resultDiv.textContent = 'Sending data...';
      resultDiv.className = '';

      const testEvents = {
        events: [
          {
            type: 'game_start',
            data: {
              language: 'spanish',
              timestamp: new Date().toISOString(),
            },
          },
          {
            type: 'answer',
            data: {
              language: 'spanish',
              wordId: 'test-1',
              word: 'hello',
              translation: 'hola',
              userAnswer: 'hola',
              isCorrect: true,
              level: 1,
              timestamp: new Date().toISOString(),
            },
          },
          {
            type: 'answer',
            data: {
              language: 'spanish',
              wordId: 'test-2',
              word: 'goodbye',
              translation: 'adiós',
              userAnswer: 'adios',
              isCorrect: true,
              level: 1,
              timestamp: new Date().toISOString(),
            },
          },
          {
            type: 'answer',
            data: {
              language: 'spanish',
              wordId: 'test-3',
              word: 'thank you',
              translation: 'gracias',
              userAnswer: 'gracia',
              isCorrect: false,
              level: 2,
              timestamp: new Date().toISOString(),
            },
          },
          {
            type: 'answer',
            data: {
              language: 'french',
              wordId: 'test-4',
              word: 'hello',
              translation: 'bonjour',
              userAnswer: 'bonjour',
              isCorrect: true,
              level: 1,
              timestamp: new Date().toISOString(),
            },
          },
          {
            type: 'game_end',
            data: {
              language: 'spanish',
              score: 150,
              level: 2,
              wordsCompleted: 15,
              livesRemaining: 1,
              timestamp: new Date().toISOString(),
            },
          },
        ],
      };

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(testEvents),
        });

        const text = await response.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch {
          data = { raw: text };
        }

        if (response.ok) {
          resultDiv.className = 'success';
          resultDiv.textContent = `✅ Success! Sent ${testEvents.events.length} events\n\nResponse:\n${JSON.stringify(data, null, 2)}\n\nNow check the dashboard: https://lexirain.vercel.app/api/dashboard`;
        } else {
          resultDiv.className = 'error';
          resultDiv.textContent = `❌ Error: ${response.status} ${response.statusText}\n\n${JSON.stringify(data, null, 2)}`;
        }
      } catch (error) {
        resultDiv.className = 'error';
        resultDiv.textContent = `❌ Network Error: ${error.message}\n\nMake sure the endpoint is deployed and accessible.`;
      }
    }

    async function checkData() {
      const resultDiv = document.getElementById('result');
      resultDiv.textContent = 'Loading data...';
      resultDiv.className = '';

      try {
        const response = await fetch(VIEW_URL);
        const data = await response.json();

        if (response.ok) {
          resultDiv.className = 'success';
          resultDiv.textContent = `📊 Current Analytics Data:\n\n${JSON.stringify(data, null, 2)}`;
        } else {
          resultDiv.className = 'error';
          resultDiv.textContent = `❌ Error: ${JSON.stringify(data, null, 2)}`;
        }
      } catch (error) {
        resultDiv.className = 'error';
        resultDiv.textContent = `❌ Error: ${error.message}`;
      }
    }
  </script>
</body>
</html>
